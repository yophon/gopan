name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # MCP 目录(Glama)收录用的自省镜像:按 Dockerfile.glama 构建,经 stdio 取一次工具清单(docs/MCP.md「目录收录」)
  glama:
    name: glama (inspection image + tools/list)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Dockerfile.glama
        run: docker build -f Dockerfile.glama -t gopan-glama .

      - name: tools/list over stdio
        run: |
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          inited='{"jsonrpc":"2.0","method":"notifications/initialized"}'
          list='{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
          out=$( (printf '%s\n%s\n%s\n' "$init" "$inited" "$list"; sleep 3) | docker run -i --rm gopan-glama gopan-inspect )
          echo "$out" | head -c 400; echo
          n=$(echo "$out" | grep -o '"name":"[a-z_]*"' | sort -u | wc -l)
          echo "distinct names in output: $n"
          test "$n" -ge 40
          echo "$out" | grep -q '"name":"prepare_upload"'
          echo "$out" | grep -q 'Schema inspection only'

      - name: mcp-proxy present
        run: docker run --rm --entrypoint sh gopan-glama -c 'command -v mcp-proxy && command -v gopan-inspect'

  server:
    name: server (go vet + go test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gopan
          POSTGRES_PASSWORD: gopan
          POSTGRES_DB: gopan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gopan"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      CGO_ENABLED: "0"
      TEST_DB_URL: postgres://gopan:gopan@127.0.0.1:5432/gopan_test?sslmode=disable
      TEST_S3_ENDPOINT: 127.0.0.1:9000
    steps:
      - uses: actions/checkout@v4

      # service 容器不能改启动命令,所以作为一个 step 起。2025 年起 docker.io/minio/minio 与
      # quay.io/minio/minio 都已不可匿名拉取;用与 compose 同一个 pgsty/minio(社区维护的 MinIO 构建,
      # 命令、环境变量、9000 端口与官方镜像一致),本地、CI、生产跑的是同一个存储。
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=gopan -e MINIO_ROOT_PASSWORD=gopan-minio-dev \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:9000/minio/health/live

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          check-latest: true
          cache-dependency-path: server/go.sum

      # 内容搜索的 PDF 提取用例要真跑 pdftotext(与生产镜像同一套 poppler)
      - name: Install poppler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils poppler-data

      - name: go vet
        working-directory: server
        run: go vet ./...

      # -p 1:集成测试包共用一个库,setup 会 DROP SCHEMA 重建,不能并行。
      # 没有 ffmpeg / gotenberg:worker 的音视频与 Office 派生用例按设计 skip;pdftotext 上面装了。
      - name: go test
        working-directory: server
        run: go test -p 1 -count=1 ./...

  web:
    name: web (typecheck + vitest + build + codegen check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: pnpm install
        working-directory: web
        run: pnpm install --frozen-lockfile

      # 前端 codegen 产物入库(doc/10),这里校验它与 schema/operations 一致。
      # 不校验 sqlc/gqlgen:sqlc 会把 store/identity.go 手写的 IDLogin/IDSession
      # 重新生成进 models.go,与仓库必然有差异(生成后需手工删掉这两个类型)。
      - name: codegen is up to date
        working-directory: web
        run: |
          pnpm codegen
          git diff --exit-code -- src/api/gen

      - name: typecheck
        working-directory: web
        run: pnpm typecheck

      - name: vitest
        working-directory: web
        run: pnpm test

      - name: build
        working-directory: web
        run: pnpm build

  android:
    name: android (lint + unit tests + debug / R8 build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Apollo 直接用 server/graph/schema.graphqls 生成:schema 改了而 App 的 operations 不兼容时这里编译失败。
      # assembleReleaseE2e 与正式包同一套 R8 规则(debug 签名,CI 里没有 keystore):R8 报缺类等构建期问题时在这里失败;
      # 运行时才暴露的规则遗漏靠本地对 releaseE2e 包跑 E2E(android/tools/e2e/README.md)。
      - name: lint + unit tests + assembleDebug + R8
        working-directory: android
        run: ./gradlew --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleReleaseE2e
