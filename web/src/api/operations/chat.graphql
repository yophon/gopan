query ChatMessages($limit: Int, $before: ID, $query: String) {
  chatMessages(limit: $limit, before: $before, query: $query) {
    id
    body
    createdAt
    node {
      id
      parentId
      name
      kind
      size
      preview {
        kind
        thumbUrl
      }
    }
  }
}

mutation SendChatMessage($body: String, $nodeId: ID) {
  sendChatMessage(body: $body, nodeId: $nodeId) {
    id
    body
    createdAt
    node {
      id
      parentId
      name
      kind
      size
      preview {
        kind
        thumbUrl
      }
    }
  }
}

mutation DeleteChatMessage($id: ID!) {
  deleteChatMessage(id: $id)
}

mutation EnsureChatFolder {
  ensureChatFolder {
    id
    parentId
    name
  }
}

query ChatFolderInfo {
  chatFolder {
    id
    parentId
    name
  }
}
