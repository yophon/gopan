mutation CreateShare($nodeId: ID!, $password: String, $expiresAt: Time, $allowUpload: Boolean) {
  createShare(nodeId: $nodeId, password: $password, expiresAt: $expiresAt, allowUpload: $allowUpload) {
    id
    token
    hasPassword
    allowUpload
    expiresAt
    createdAt
    node {
      id
      name
      kind
    }
  }
}

mutation RevokeShare($id: ID!) {
  revokeShare(id: $id)
}

mutation SetShareUpload($id: ID!, $allow: Boolean!) {
  setShareUpload(id: $id, allow: $allow)
}

query MyShares {
  myShares {
    id
    token
    hasPassword
    allowUpload
    expiresAt
    createdAt
    visitStats {
      verifyCount
      downloadCount
      uploadCount
      lastVisitAt
      lastVisitKind
    }
    node {
      id
      name
      kind
    }
  }
}

# 某个分享最近的访问明细,只有属主能看
query ShareVisits($shareId: ID!, $limit: Int) {
  shareVisits(shareId: $shareId, limit: $limit) {
    kind
    ip
    userAgent
    detail
    createdAt
  }
}

# 公开查询,验密前的最小信息
query ShareInfo($token: String!) {
  shareInfo(token: $token) {
    token
    name
    kind
    needPassword
    expired
    allowUpload
    expiresAt
    size
    fileCount
  }
}

# 无密码分享也走这条(password 传空串)拿访客 token
mutation VerifySharePassword($token: String!, $password: String!) {
  verifySharePassword(token: $token, password: $password) {
    accessToken
  }
}

# 访客视角的分享根(guest token 调用)
query ShareRoot {
  shareRoot {
    id
    name
    kind
    size
    updatedAt
  }
}

# ---- 分享访客上传(doc/32 一,guest token 调用)----

mutation ShareInitUpload($parentId: ID!, $name: String!, $size: Int64!, $uploaderName: String) {
  shareInitUpload(parentId: $parentId, name: $name, size: $size, uploaderName: $uploaderName) {
    ...CollectSessionFields
  }
}

query ShareUploadSession($id: ID!) {
  shareUploadSession(id: $id) {
    ...CollectSessionFields
  }
}

mutation ShareCompleteUpload($sessionId: ID!, $etags: [PartEtag!]!) {
  shareCompleteUpload(sessionId: $sessionId, etags: $etags) {
    id
    name
    size
  }
}

mutation ShareAbortUpload($sessionId: ID!) {
  shareAbortUpload(sessionId: $sessionId)
}

mutation ShareEnsureFolder($parentId: ID!, $name: String!, $uploaderName: String) {
  shareEnsureFolder(parentId: $parentId, name: $name, uploaderName: $uploaderName) {
    id
    name
  }
}
