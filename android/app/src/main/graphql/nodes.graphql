# 文件节点 operations(文件线)。字段选择以 web/src/api/operations/nodes.graphql 为底,
# 列表类查询共用 NodeItem 片段:Children / SearchNodes / SearchContent / Trash / Node / CreateFolder / RenameNode
# 都映射到同一个生成类型,core.data 里只写一处 toNode()。
# 比网页端多选了 mime(列表图标按 kind/mime 分类)与 createdAt(详情页),都是 schema 已有字段。
# deletedAt / purgeAt 只有 trash 查询会填,其它查询返回 null。

fragment NodeItem on Node {
  id
  parentId
  name
  kind
  size
  mime
  createdAt
  updatedAt
  deletedAt
  purgeAt
  subtreeBytes
  subtreeCount
  statsStale
  starred
  preview {
    kind
    thumbUrl
  }
}

query Children($parentId: ID, $cursor: String, $order: NodeOrder, $desc: Boolean) {
  children(parentId: $parentId, cursor: $cursor, order: $order, desc: $desc) {
    items {
      ...NodeItem
    }
    nextCursor
    total
  }
}

# 预览专用单节点查询:列表里的 preview 只有 kind/thumbUrl 可靠,
# 完整预签名 URL(15 分钟有效)必须打开预览时即查即用。
# 外挂字幕与播放进度(doc/22 二)只在单个节点上取,列表里不请求。
query NodePreview($id: ID!) {
  node(id: $id) {
    id
    parentId
    name
    kind
    size
    mime
    sha256
    updatedAt
    preview {
      kind
      thumbUrl
      largeUrl
      contentUrl
      status
      durationSec
      # .md 且不超过 2 MB:默认渲染着看(GET /md/{id}),可切回文本(doc/23 五.2)
      markdown
      subtitles {
        nodeId
        name
        label
        lang
        default
      }
    }
    playProgress {
      ...PlayProgressFields
    }
  }
}

mutation RequestPreview($nodeId: ID!) {
  requestPreview(nodeId: $nodeId) {
    kind
    status
    contentUrl
  }
}

query Node($id: ID!) {
  node(id: $id) {
    ...NodeItem
  }
}

mutation CreateFolder($parentId: ID, $name: String!) {
  createFolder(parentId: $parentId, name: $name) {
    ...NodeItem
  }
}

mutation RenameNode($id: ID!, $name: String!) {
  renameNode(id: $id, name: $name) {
    ...NodeItem
  }
}

mutation MoveNodes($ids: [ID!]!, $targetParentId: ID) {
  moveNodes(ids: $ids, targetParentId: $targetParentId) {
    id
    parentId
    name
  }
}

mutation DeleteNodes($ids: [ID!]!) {
  deleteNodes(ids: $ids)
}

mutation CopyNodes($ids: [ID!]!, $targetParentId: ID) {
  copyNodes(ids: $ids, targetParentId: $targetParentId) {
    id
    parentId
    name
  }
}

query SearchNodes($q: String!, $cursor: String) {
  searchNodes(q: $q, cursor: $cursor) {
    items {
      ...NodeItem
    }
    nextCursor
    total
  }
}

# 按内容搜索(doc/20):命中片段 + 高亮区间(片段内按码点计)+ PDF 页码;不返回 total。
# node 用 NodeItem 片段,与文件名结果同一个 toNode():长按操作、所在目录、预览都照常复用。
query SearchContent($q: String!, $cursor: String) {
  searchContent(q: $q, cursor: $cursor) {
    items {
      node {
        ...NodeItem
      }
      snippet
      highlights {
        start
        length
      }
      page
    }
    nextCursor
  }
}
