mutation CreateShare($nodeId: ID!, $password: String, $expiresAt: Time, $allowUpload: Boolean) {
  createShare(nodeId: $nodeId, password: $password, expiresAt: $expiresAt, allowUpload: $allowUpload) {
    id
    token
    hasPassword
    allowUpload
    expiresAt
    createdAt
    node {
      id
      name
      kind
    }
  }
}

mutation RevokeShare($id: ID!) {
  revokeShare(id: $id)
}

# 文件夹分享打开 / 关掉「对方上传」(doc/32 一)
mutation SetShareUpload($id: ID!, $allow: Boolean!) {
  setShareUpload(id: $id, allow: $allow)
}

query MyShares {
  myShares {
    id
    token
    hasPassword
    allowUpload
    expiresAt
    createdAt
    visitStats {
      verifyCount
      downloadCount
      uploadCount
      lastVisitAt
      lastVisitKind
    }
    node {
      id
      name
      kind
    }
  }
}

# 某个分享最近的访问明细,只有属主能看
query ShareVisits($shareId: ID!, $limit: Int) {
  shareVisits(shareId: $shareId, limit: $limit) {
    kind
    ip
    userAgent
    detail
    createdAt
  }
}

# 公开查询,验密前的最小信息
query ShareInfo($token: String!) {
  shareInfo(token: $token) {
    token
    name
    kind
    needPassword
    expired
  }
}

# 无密码分享也走这条(password 传空串)拿访客 token
mutation VerifySharePassword($token: String!, $password: String!) {
  verifySharePassword(token: $token, password: $password) {
    accessToken
  }
}

# 访客视角的分享根(guest token 调用)
query ShareRoot {
  shareRoot {
    id
    name
    kind
    size
    updatedAt
  }
}

# 「生成分享链接」传上来的文件放的文件夹(doc/31 四)
mutation QuickShareFolder {
  quickShareFolder {
    id
  }
}
