# 回收站 operations(文件线)。列表项用 nodes.graphql 里的 NodeItem 片段,deletedAt / purgeAt 在这里才有值。
query Trash($cursor: String) {
  trash(cursor: $cursor) {
    items {
      ...NodeItem
    }
    nextCursor
    total
  }
}

mutation RestoreNodes($ids: [ID!]!) {
  restoreNodes(ids: $ids) {
    id
    parentId
    name
  }
}

mutation PurgeNodes($ids: [ID!]!) {
  purgeNodes(ids: $ids)
}

mutation PurgeTrash {
  purgeTrash
}
