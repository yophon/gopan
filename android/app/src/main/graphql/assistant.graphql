# 助手(doc/33):模型服务、权限、对话记录。对话本身由 QuickJS 里的运行时直接调 /query,这里只放界面要的

query AiProviders {
  aiProviders {
    id
    name
    kind
    baseUrl
    models
    hasKey
    site
    dailyTokens
    usedTokens
  }
}

mutation CreateAiProvider($input: AiProviderInput!) {
  createAiProvider(input: $input) { id }
}

mutation UpdateAiProvider($id: ID!, $input: AiProviderInput!) {
  updateAiProvider(id: $id, input: $input) { id }
}

mutation DeleteAiProvider($id: ID!) {
  deleteAiProvider(id: $id)
}

query AiConversations($limit: Int) {
  aiConversations(limit: $limit) {
    id
    title
    providerId
    model
    updatedAt
    runner
    runStatus
  }
}

mutation DeleteAiConversation($id: ID!) {
  deleteAiConversation(id: $id)
}

query AssistantAccess {
  assistantAccess {
    disabled
    groups { key label permission outbound }
  }
}

mutation SetAssistantAccess($disabled: Boolean!, $groups: [AssistantGroupInput!]!) {
  setAssistantAccess(disabled: $disabled, groups: $groups) {
    disabled
    groups { key label permission outbound }
  }
}

# 服务器上运行(doc/34)

query AiRunAvailable {
  aiRunAvailable
}

query AiRun($conversationId: ID!) {
  aiRun(conversationId: $conversationId) { id conversationId status approval error }
}

query AiConversationRunner($id: ID!) {
  aiConversation(id: $id) { id runner }
}

mutation StartAiRun($conversationId: ID, $text: String!, $context: String, $providerId: ID!, $model: String, $images: [String!]) {
  startAiRun(conversationId: $conversationId, text: $text, context: $context, providerId: $providerId, model: $model, images: $images) { id conversationId status approval error }
}

# 回答里引用的文件(doc/35 六):查不到的不返回
query NodesByIds($ids: [ID!]!) {
  nodesByIds(ids: $ids) { id name kind size path preview { kind thumbUrl largeUrl } }
}

# 引用写的是路径时
query NodesByPaths($paths: [String!]!) {
  nodesByPaths(paths: $paths) { id name kind size path preview { kind thumbUrl largeUrl } }
}

mutation AnswerAiRun($id: ID!, $answer: String!) {
  answerAiRun(id: $id, answer: $answer)
}

mutation StopAiRun($id: ID!) {
  stopAiRun(id: $id)
}

mutation SetAiConversationRunner($id: ID!, $runner: AiRunner!) {
  setAiConversationRunner(id: $id, runner: $runner)
}
