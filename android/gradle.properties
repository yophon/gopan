# Gradle 守护进程内存;Compose + KSP + Apollo 代码生成 2g 会吃紧
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# 服务端地址与账号中心参数(写进 BuildConfig)。本地联调可在这里或命令行 -P 覆盖,例如
#   ./gradlew -Pgopan.baseUrl=http://10.0.2.2:8090 :app:installDebug
# 留空即用默认值(生产)。
gopan.baseUrl=
gopan.idIssuer=
gopan.idClientId=
gopan.idRedirect=
