schema:
  - graph/schema.graphqls

exec:
  package: graph
  layout: single-file
  filename: internal/graph/generated.go

model:
  filename: internal/graph/models_gen.go
  package: graph

resolver:
  layout: follow-schema
  dir: internal/graph
  package: graph
  filename_template: "{name}.resolvers.go"

omit_gqlgen_version_in_file_notice: true

models:
  Node:
    extraFields:
      InList:
        type: bool
        description: "由列表转换器置位:preview 走零查询乐观路径"
      StarredAt:
        type: "*time.Time"
        description: "由转换器置位;starred / openedAt 字段 resolver 按身份决定给不给"
      OpenedAtRaw:
        type: "*time.Time"
        description: "由转换器置位"
    fields:
      starred:
        resolver: true
      openedAt:
        resolver: true
      downloadUrl:
        resolver: true
      preview:
        resolver: true
      playProgress:
        resolver: true
      path:
        resolver: true
  User:
    fields:
      unreadNotifications:
        resolver: true
  ChatMessage:
    extraFields:
      NodeID:
        type: string
        description: "由列表转换器置位,供 node 字段 resolver 恢复真实 uuid"
    fields:
      node:
        resolver: true
  Job:
    extraFields:
      ResultID:
        type: string
        description: "由转换器置位:下好的文件 / 解出来的文件夹,供 result 字段 resolver 取节点"
      OwnerID:
        type: string
        description: "由转换器置位"
    fields:
      result:
        resolver: true
  Activity:
    extraFields:
      OwnerID:
        type: string
        description: "由转换器置位,供 node 字段 resolver 取节点"
    fields:
      node:
        resolver: true
  Feed:
    extraFields:
      OwnerID:
        type: string
        description: "由转换器置位"
      FolderID:
        type: string
        description: "由转换器置位,供 folder 字段 resolver 取节点"
    fields:
      folder:
        resolver: true
      folderPath:
        resolver: true
  FeedItem:
    extraFields:
      OwnerID:
        type: string
        description: "由转换器置位"
      NodeID:
        type: string
        description: "由转换器置位,供 node 字段 resolver 取节点"
    fields:
      node:
        resolver: true
  Clip:
    extraFields:
      OwnerID:
        type: string
        description: "由转换器置位"
      NodeID:
        type: string
        description: "由转换器置位,供 node 字段 resolver 取节点"
      AssetsID:
        type: string
        description: "由转换器置位,供 assets 字段 resolver 取节点"
    fields:
      node:
        resolver: true
      assets:
        resolver: true
  ID:
    model: github.com/99designs/gqlgen/graphql.String
  Int64:
    model: github.com/99designs/gqlgen/graphql.Int64
  Time:
    model: github.com/99designs/gqlgen/graphql.Time
