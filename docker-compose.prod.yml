# 生产部署:docker compose -f docker-compose.prod.yml up -d
# 先准备 .env(见 .env.example)和 secrets/jwt_secret(≥32 字节随机串),见 doc/09-上线手册。
#
# 两个可选组件靠 profile 开关,在 .env 里用 COMPOSE_PROFILES 选:
#   office —— Gotenberg(Office→PDF 预览)。全家桶里的内存大户,2G 机器建议关。
#   caddy  —— 自带反代 + 自动证书。宿主已有 nginx 占着 80/443 时关掉,见 deploy/nginx/。
# 两个都开 = 全家桶(COMPOSE_PROFILES=office,caddy);都不开 = 只跑 gopan + postgres + minio。
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # 小内存机器可把 shared_buffers 压到 32MB、连接数压到 30(gopan 单实例用不满)
    command: >
      postgres
      -c shared_buffers=${PG_SHARED_BUFFERS:-128MB}
      -c max_connections=${PG_MAX_CONNECTIONS:-100}
    environment:
      POSTGRES_USER: gopan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: gopan
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: ${PG_MEM_LIMIT:-0} # 0 = 不限
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gopan -d gopan"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: gopan
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes:
      - miniodata:/data
    # 默认只绑 127.0.0.1:19000,给宿主反代转 /{bucket}/* 用;caddy profile 下走容器网络,这个口开着也不对外
    ports:
      - "${MINIO_S3_BIND:-127.0.0.1:19000}:9000"
    mem_limit: ${MINIO_MEM_LIMIT:-0}
    # edge:反代把 /{bucket}/* 转过来,浏览器直传/直取走这条路
    networks: [backend, edge]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  gotenberg:
    image: gotenberg/gotenberg:8
    profiles: ["office"]
    restart: unless-stopped
    # LibreOffice 常驻 300~500MB、转换峰值更高。内存紧张又想要 Office 预览:
    # 开这个 profile 并把 GOTENBERG_MEM_LIMIT 收到 512m,让它带着枷锁跑。
    mem_limit: ${GOTENBERG_MEM_LIMIT:-0}
    # 只挂 backend(internal 网络无出网):它处理的是用户上传的文件,防 SSRF
    networks: [backend]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  gopan:
    build:
      context: .
      # 国内构建可加:args: { GOPROXY: "https://goproxy.cn,direct" }
    image: gopan:latest
    restart: unless-stopped
    environment:
      GOPAN_DB_URL: postgres://gopan:${POSTGRES_PASSWORD:?}@postgres:5432/gopan?sslmode=disable
      GOPAN_ID_ISSUER: ${GOPAN_ID_ISSUER:-}
      GOPAN_ID_ORIGIN: ${GOPAN_ID_ORIGIN:-}
      GOPAN_ID_CLIENT_ID: ${GOPAN_ID_CLIENT_ID:-gopan}
      GOPAN_ID_SECRET: ${GOPAN_ID_SECRET:-}
      GOPAN_ID_SUBJECT: ${GOPAN_ID_SUBJECT:-}
      GOPAN_ID_USER_ID: ${GOPAN_ID_USER_ID:-}
      GOPAN_S3_ENDPOINT: minio:9000
      GOPAN_S3_PUBLIC_ENDPOINT: ${GOPAN_DOMAIN:?}          # 预签名 host = 对外域名
      GOPAN_S3_PUBLIC_USE_SSL: "true"                       # 浏览器经反代走 https
      GOPAN_S3_KEY: gopan
      GOPAN_S3_SECRET: ${MINIO_ROOT_PASSWORD:?}
      GOPAN_S3_BUCKET: gopan                                # 改名须同步反代的 /gopan/* 路由
      # 置空 = 本次部署不提供 Office 预览(不开 office profile 时就该置空):后端不再入队转换,
      # 预览直接回 UNAVAILABLE、前端引导下载。这里用 `-` 而不是 `:-`,空值要原样保留。
      GOPAN_GOTENBERG_URL: ${GOPAN_GOTENBERG_URL-http://gotenberg:3000}
      GOPAN_JWT_SECRET_FILE: /run/secrets/jwt_secret
      GOPAN_REGISTER_OPEN: ${GOPAN_REGISTER_OPEN:-true}
      GOPAN_DEFAULT_QUOTA: ${GOPAN_DEFAULT_QUOTA:-107374182400}
      # 回收站保留期,到期由 worker 每小时扫描彻删。回收站页面显示的"还剩 N 天"读的就是它。
      # ⚠ 调小会让下一轮清理立刻删掉历史回收站内容,改之前先备份。
      GOPAN_TRASH_TTL: ${GOPAN_TRASH_TTL:-720h}
      # 信任哪些来源的 X-Forwarded-For。两档反代(Caddy 容器 / 宿主 nginx)都经容器网络
      # 进来,所以默认信任 docker 私有网段。不配的话后端看到的客户端 IP 永远是网关地址:
      # 登录限速会退化成"全站共用一个桶"。这个容器唯一的入网口是 127.0.0.1 的端口发布,
      # 只有宿主本地进程能连到,信任私有网段是安全的。
      GOPAN_TRUSTED_PROXIES: ${GOPAN_TRUSTED_PROXIES:-172.16.0.0/12,10.0.0.0/8}
      # 离线下载(doc/21):服务器替用户从链接拉文件,内网地址一律拒绝。GOPAN_FETCH_DENY 填这台
      # 机器自己的公网 IP:从容器访问宿主机公网地址可能绕过只防外部的防火墙。GOPAN_FETCH=false 全站关掉
      GOPAN_FETCH: ${GOPAN_FETCH:-true}
      GOPAN_FETCH_DENY: ${GOPAN_FETCH_DENY:-}
      GOPAN_FETCH_RATE: ${GOPAN_FETCH_RATE:-0}
      # 站点对外地址:直链的完整地址、推送里的跳转链接用。留空按上面的 S3 外部地址推断(https://<GOPAN_DOMAIN>)
      GOPAN_PUBLIC_URL: ${GOPAN_PUBLIC_URL:-}
      # 「今天」「本月」按哪个时区算(直链日上限与统计、图床的年-月文件夹)
      GOPAN_TZ: ${GOPAN_TZ:-Asia/Shanghai}
      # 直链与图床(doc/22 四):每条每天、全站每月的流量上限,超了暂停并提醒;GOPAN_LINKS=false 全站关掉
      GOPAN_LINKS: ${GOPAN_LINKS:-true}
      GOPAN_LINK_DAILY_BYTES: ${GOPAN_LINK_DAILY_BYTES:-5368709120}
      GOPAN_LINK_MONTHLY_BYTES: ${GOPAN_LINK_MONTHLY_BYTES:-214748364800}
      GOPAN_IMG_MAX_SIZE: ${GOPAN_IMG_MAX_SIZE:-20971520}
      # 推送(doc/22 三):推到内网里自建的 ntfy / webhook 时打开(同样受 GOPAN_FETCH_DENY 约束)
      GOPAN_NOTIFY_ALLOW_PRIVATE: ${GOPAN_NOTIFY_ALLOW_PRIVATE:-false}
      # 安卓 App 的「检查更新」与安装包下载:发版时把 apk 与 latest.json 放进宿主 ./android-release(见 doc/09)。
      # 目录为空时 /api/app/android/latest 回 404,App 提示「这个站点没有提供安卓安装包」
      GOPAN_APP_RELEASE_DIR: /data/android-release
    volumes:
      - ./android-release:/data/android-release:ro
    secrets:
      - jwt_secret
    # 默认只绑 127.0.0.1:18080,给宿主反代用;caddy profile 下反代走容器网络,不影响
    ports:
      - "${GOPAN_HTTP_BIND:-127.0.0.1:18080}:8080"
    mem_limit: ${GOPAN_MEM_LIMIT:-0}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [backend, edge]

  caddy:
    image: caddy:2
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      GOPAN_DOMAIN: ${GOPAN_DOMAIN:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - gopan
    networks: [edge]

networks:
  backend:
    internal: true # 不通公网:postgres/minio/gotenberg 全部只在内网
  edge: {}

volumes:
  pgdata:
  miniodata:
  caddydata:
  caddyconfig:

secrets:
  jwt_secret:
    file: ./secrets/jwt_secret
