services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gopan
      POSTGRES_PASSWORD: gopan
      POSTGRES_DB: gopan
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gopan"]
      interval: 2s
      timeout: 2s
      retries: 15

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gopan
      MINIO_ROOT_PASSWORD: gopan-minio-dev
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "127.0.0.1:3100:3000"

volumes:
  pgdata:
  miniodata:
