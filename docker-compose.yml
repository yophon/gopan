services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gopan
      POSTGRES_PASSWORD: gopan
      POSTGRES_DB: gopan
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gopan"]
      interval: 2s
      timeout: 2s
      retries: 15

  minio:
    # docker.io/minio/minio 与 quay.io/minio/minio 自 2025 年起不能匿名拉取。pgsty/minio 是社区维护的
    # MinIO 构建:入口、命令、/data 布局、mc 都与官方镜像一致(doc/09「MinIO 镜像」)
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gopan
      MINIO_ROOT_PASSWORD: gopan-minio-dev
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "127.0.0.1:3100:3000"

volumes:
  pgdata:
  miniodata:
